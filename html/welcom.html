<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcom</title>
    <link rel="stylesheet" href="../css/welcom.css">
    <script defer src="../js/welcom.js"></script>
</head>

<body>
    <div class="content">
        <img src="../pic/windows-g8408a779c_1280.jpg" class="backimg">
        <div class="form">
            <div class="username">
                <label for="name">הכנס שם</label>
                <input type="text" required id="name">
            </div>
            <div class="userpass">
                <label for="pass">הכנס סיסמא</label>
                <input type="password" required id="pass">
            </div>
            <div class="userpass">
                <label for="pass">אימות סיסמא</label>
                <input type="password" required id="checkpass">
            </div>
            <button class="enterbutton">הרשם</button>
            <a class="enter" href="../html/enter.html">משתמש ישן? להכנס</a>
        </div>
    </div>
</body>

</html>
